# nginx.conf — Walters Bakery SPA
# SPA fallback a index.html para que React Router funcione en refrescos / rutas profundas.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresion simple
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # Cache largo para assets con hash en el nombre (Vite usa [name].[hash].js)
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: cualquier ruta desconocida devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # No cachear el HTML para que despliegues nuevos sean inmediatos
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
}
